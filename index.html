<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>资料访问</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#303d35;background:#f5f3ed}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}[hidden]{display:none!important}.gate{min-height:100svh;display:grid;place-items:center;padding:28px}.card{width:min(100%,420px);padding:36px;background:#fffdf8;border:1px solid #dedfd4;border-radius:20px;box-shadow:0 18px 60px #3448390b}.mark{width:48px;height:48px;color:#45634b;background:#e9eee2;border-radius:15px;display:grid;place-items:center;margin-bottom:22px}.mark svg{width:25px;height:25px}h1{font-size:25px;margin:0 0 10px;font-weight:650}.intro{font-size:15px;line-height:1.7;color:#697467;margin:0 0 28px}label{display:block;font-size:14px;margin-bottom:9px}input{width:100%;height:48px;padding:10px 13px;background:#fff;border:1px solid #c8d1c5;border-radius:9px;font-size:17px}input:focus{outline:3px solid #45634b22;border-color:#45634b}button{cursor:pointer;min-height:44px;border:0;border-radius:9px;background:#45634b;color:#fff}button:disabled{opacity:.6;cursor:wait}.open{width:100%;margin-top:16px}.status{font-size:14px;line-height:1.6;color:#697467;min-height:23px;margin:15px 0 0}.status.error{color:#a13632}.toolbar{height:45px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #dde1d5;background:#fffdf8;font-size:13px;color:#65715f}.toolbar button{font-size:13px;min-height:32px;padding:3px 13px;color:#45634b;border:1px solid #cdd6c9;background:transparent}iframe{display:block;border:0;width:100%;height:calc(100dvh - 45px);background:#f6f3ec}@media(max-width:480px){.card{padding:28px}.gate{padding:20px}}
</style>
<script src="unlock.js" defer></script>
</head>
<body>
<main class="gate" id="gate"><section class="card">
<div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 018 0v3M12 14v3"/></svg></div>
<h1>打开资料</h1><p class="intro">请输入分享者提供的访问密码。</p>
<form id="unlockForm"><label for="password">访问密码</label><input id="password" name="access-password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="status"><button class="open" id="openButton" type="submit">打开网页</button></form>
<p class="status" id="status" role="status" aria-live="polite"></p><noscript>请启用浏览器的 JavaScript 后打开。</noscript>
</section></main>
<section id="viewer" hidden><div class="toolbar"><span>本次查看已解锁</span><button id="lockButton" type="button">锁定并退出</button></div><iframe id="report" title="资料内容" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe></section>
</body></html>
